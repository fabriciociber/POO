{% extends 'base.html' %}{% block title %}Criar conta — ClassSync{% endblock %}{% block content %}<div class="login-wrap"><section class="panel login-card"><div class="login-logo"><span class="brand-mark"><i class="bi bi-person-plus"></i></span><h1>Criar conta</h1><p>Cadastre-se para acompanhar o calendário da sua turma.</p></div><form method="post"><label class="form-label">Nome completo</label><input class="form-control mb-3" name="name" required minlength="2" maxlength="120" value="{{ request.form.get('name','') }}"><label class="form-label">E-mail</label><input class="form-control mb-3" type="email" name="email" required value="{{ request.form.get('email','') }}"><label class="form-label">Senha</label><input class="form-control mb-3" type="password" name="password" required minlength="8"><button class="btn btn-primary w-100" type="submit">Criar conta <i class="bi bi-arrow-right ms-2"></i></button></form><p class="text-center mt-3 mb-0 small">Já possui conta? <a href="{{ url_for('login') }}">Entrar</a></p></section></div>{% endblock %}
